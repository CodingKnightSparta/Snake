<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE // MINIMALIST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #f0f0f0;
            --death-color: #bc0000;
            --transition-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important; /* Absolute ban on rounded corners */
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Prevent scrolling/zooming while playing */
        }

        @media screen and (max-width: 768px) {
            #game-canvas {
                width: auto !important;
                height: auto !important;
                max-width: 90vw;
                max-height: 80vh;
            }
            #score-board {
                top: -30px;
                font-size: 1rem;
            }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- Landing Page --- */
        #landing-page {
            position: absolute;
            z-index: 10;
            text-align: center;
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
            cursor: pointer;
        }

        .landing-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards 0.2s;
        }

        .start-trigger {
            width: 0;
            height: 2px;
            background: var(--accent-color);
            margin: 0 auto;
            transition: width 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        #landing-page:hover .start-trigger {
            width: 200px;
        }

        .start-text {
            margin-top: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.6;
        }

        /* --- Game Layout --- */
        #game-container {
            position: relative;
            display: none;
            opacity: 0;
            transition: opacity var(--transition-speed);
        }

        #game-canvas {
            background-color: #000;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: block;
        }

        #score-board {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* --- Kill Screen --- */
        #kill-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
        }

        .death-title {
            color: var(--death-color);
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .final-score {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .retry-btn {
            padding: 12px 40px;
            border: 1px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .retry-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: -1;
        }

        .retry-btn:hover {
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(240, 240, 240, 0.3);
        }

        .retry-btn:hover::before {
            left: 0;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="landing-title">SNAKE CORE</h1>
        <div class="start-trigger"></div>
        <p class="start-text">Click to Initialize</p>
    </div>

    <div id="game-container">
        <div id="score-board">SCORE: 0</div>
        <canvas id="game-canvas"></canvas>
    </div>

    <div id="kill-screen">
        <h2 class="death-title">CRITICAL ERROR</h2>
        <p class="final-score">FINAL DATA: <span id="final-score-val">0</span></p>
        <button class="retry-btn" onclick="resetGame()">REBOOT SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score-board');
        const finalScoreElement = document.getElementById('final-score-val');
        const landingPage = document.getElementById('landing-page');
        const gameContainer = document.getElementById('game-container');
        const killScreen = document.getElementById('kill-screen');

        // Configuration
        const GRID_SIZE = 20;
        const TILE_COUNT = 25;
        canvas.width = canvas.height = GRID_SIZE * TILE_COUNT;

        let score = 0;
        let gameRunning = false;
        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let inputQueue = [];
        let lastTickTime = 0;
        const TICK_RATE = 110; // ms per move

        // For smooth animation (lerping)
        let prevSnake = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.size = Math.random() * 5 + 2;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravity
                this.life -= 0.02;
            }
            draw() {
                ctx.fillStyle = `rgba(188, 0, 0, ${this.life})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        let particles = [];

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            dx = 0; dy = -1;
            nextDx = 0; nextDy = -1;
            score = 0;
            scoreElement.innerText = `SCORE: ${score}`;
            spawnFood();
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };
            // Prevent food from spawning on snake
            snake.forEach(seg => {
                if (seg.x === food.x && seg.y === food.y) spawnFood();
            });
        }

        // Input Handling with Queue
        window.addEventListener('keydown', e => {
            const key = e.key;

            // Space to start/reboot
            if (key === ' ' || key === 'Spacebar') {
                if (!gameRunning) {
                    if (!landingPage.classList.contains('hidden')) {
                        landingPage.click();
                    } else if (killScreen.style.display === 'flex') {
                        resetGame();
                    }
                }
                e.preventDefault(); // Prevent page scrolling
                return;
            }

            let newDx = dx;
            let newDy = dy;

            if ((key === 'ArrowUp' || key === 'w' || key === 'W')) { newDx = 0; newDy = -1; }
            else if ((key === 'ArrowDown' || key === 's' || key === 'S')) { newDx = 0; newDy = 1; }
            else if ((key === 'ArrowLeft' || key === 'a' || key === 'A')) { newDx = -1; newDy = 0; }
            else if ((key === 'ArrowRight' || key === 'd' || key === 'D')) { newDx = 1; newDy = 0; }
            else return;

            // Prevent 180 degree turns relative to current moving direction
            // but allow them to be queued
            const lastInput = inputQueue.length > 0 ? inputQueue[inputQueue.length-1] : {dx, dy};
            if (newDx !== -lastInput.dx && newDy !== -lastInput.dy) {
                inputQueue.push({ dx: newDx, dy: newDy });
            }
        });

        // Swipe Handling
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            let newDx = dx;
            let newDy = dy;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal swipe
                if (Math.abs(diffX) > 30) {
                    newDx = diffX > 0 ? 1 : -1;
                    newDy = 0;
                }
            } else {
                // Vertical swipe
                if (Math.abs(diffY) > 30) {
                    newDx = 0;
                    newDy = diffY > 0 ? 1 : -1;
                }
            }

            if (newDx !== dx || newDy !== dy) {
                const lastInput = inputQueue.length > 0 ? inputQueue[inputQueue.length-1] : {dx, dy};
                if (newDx !== -lastInput.dx && newDy !== -lastInput.dy) {
                    inputQueue.push({ dx: newDx, dy: newDy });
                }
            }
        }, { passive: true });

        function update(timestamp) {
            if (!gameRunning) return;

            if (timestamp - lastTickTime > TICK_RATE) {
                lastTickTime = timestamp;

                // Process Input Queue
                if (inputQueue.length > 0) {
                    const nextMove = inputQueue.shift();
                    dx = nextMove.dx;
                    dy = nextMove.dy;
                }

                // Save previous state for lerping
                prevSnake = snake.map(s => ({...s}));

                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Collision: Walls
                if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                    gameOver(head.x * GRID_SIZE, head.y * GRID_SIZE);
                    return;
                }

                // Collision: Self
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver(head.x * GRID_SIZE, head.y * GRID_SIZE);
                        return;
                    }
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreElement.innerText = `SCORE: ${score}`;
                    spawnFood();
                } else {
                    snake.pop();
                }
            }

            draw(timestamp);
            requestAnimationFrame(update);
        }

        function draw(timestamp) {
            // Clear Canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Interpolation Factor
            const elapsed = timestamp - lastTickTime;
            const t = Math.min(1, elapsed / TICK_RATE);

            // Draw Food as a Glowing Dot
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#bc0000';
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(foodX, foodY, GRID_SIZE / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for snake

            // Draw Snake with Smooth Movement
            ctx.fillStyle = '#f0f0f0';
            snake.forEach((seg, i) => {
                const prev = prevSnake[i] || seg;
                const curX = prev.x * GRID_SIZE + (seg.x - prev.x) * GRID_SIZE * t;
                const curY = prev.y * GRID_SIZE + (seg.y - prev.y) * GRID_SIZE * t;

                ctx.fillRect(curX + 1, curY + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });

            // Draw Blood Particles
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            });
        }

        function gameOver(x, y) {
            gameRunning = false;

            // Create Blood Splatter
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y));
            }

            // Final render for particles
            const animateDeath = (ts) => {
                draw(ts);
                if (particles.length > 0) requestAnimationFrame(animateDeath);
            };
            requestAnimationFrame(animateDeath);

            setTimeout(() => {
                finalScoreElement.innerText = score;
                killScreen.style.display = 'flex';
            }, 500);
        }

        function resetGame() {
            killScreen.style.display = 'none';
            initGame();
            gameRunning = true;
            requestAnimationFrame(update);
        }

        // Transitions
        landingPage.addEventListener('click', () => {
            landingPage.classList.add('hidden');
            gameContainer.style.display = 'block';
            setTimeout(() => {
                gameContainer.style.opacity = '1';
                initGame();
                gameRunning = true;
                requestAnimationFrame(update);
            }, 100);
        });

    </script>
</body>
</html>
